<svg width="100%" height="220" viewBox="0 0 1440 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pinkGradient1" x1="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb8dd" />
      <stop offset="100%" stop-color="#ff8ac7" />
    </linearGradient>

    <linearGradient id="pinkGradient2" x1="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8ac7" />
      <stop offset="100%" stop-color="#ff4da6" />
    </linearGradient>

    <linearGradient id="pinkGradient3" x1="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4da6" />
      <stop offset="100%" stop-color="#ff1e8a" />
    </linearGradient>
  </defs>

  <!-- CAMADA 1 (fundo, suave, paralela) -->
  <path 
    d="M0 0 C 360 40, 720 10, 1440 50 L1440 220 L0 220 Z"
    fill="url(#pinkGradient1)"
  >
    <animate 
      attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      values="
        M0 0 C 360 40, 720 10, 1440 50 L1440 220 L0 220 Z;
        M0 0 C 360 60, 720 30, 1440 40 L1440 220 L0 220 Z;
        M0 0 C 360 40, 720 10, 1440 50 L1440 220 L0 220 Z
      "
    />
  </path>

  <!-- CAMADA 2 (meio, mais marcada, paralela) -->
  <path 
    d="M0 0 C 360 60, 720 30, 1440 70 L1440 220 L0 220 Z"
    fill="url(#pinkGradient2)"
    opacity="0.9"
  >
    <animate 
      attributeName="d"
      dur="5s"
      repeatCount="indefinite"
      values="
        M0 0 C 360 60, 720 30, 1440 70 L1440 220 L0 220 Z;
        M0 0 C 360 80, 720 50, 1440 60 L1440 220 L0 220 Z;
        M0 0 C 360 60, 720 30, 1440 70 L1440 220 L0 220 Z
      "
    />
  </path>

  <!-- CAMADA 3 (frente, mais forte, paralela, animada mais rápido) -->
  <path 
    d="M0 0 C 360 80, 720 50, 1440 90 L1440 220 L0 220 Z"
    fill="url(#pinkGradient3)"
    opacity="1"
  >
    <animate 
      attributeName="d"
      dur="4s"
      repeatCount="indefinite"
      values="
        M0 0 C 360 80, 720 50, 1440 90 L1440 220 L0 220 Z;
        M0 0 C 360 100, 720 70, 1440 80 L1440 220 L0 220 Z;
        M0 0 C 360 80, 720 50, 1440 90 L1440 220 L0 220 Z
      "
    />
  </path>
</svg>

